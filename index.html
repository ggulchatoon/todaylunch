<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F9F8F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>todaylunch</title>
<meta name="apple-mobile-web-app-title" content="todaylunch">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 디자인 규칙 (v6) =====
   주인공: 오늘 = 메뉴 이름 / 비용 = 이번 주 쓴 돈
   제목 줄: 왼쪽 = 지금 보는 날짜·기간(오늘 탭은 로고 + 날짜), 오른쪽 = 이동 화살표. 설정은 오늘 탭에만, 회색 톱니
   로고: Fredoka, 커피 브라운 글자 + 노른자 노랑 점. 노랑은 글자로 쓰지 않음
   포인트색 역할
   - 버터 노랑(--accent): 면으로만. 주요 버튼, 선택된 하단 탭, 오늘 줄 배경
   - 커피 브라운(--accent-ink): 글자·막대. 할 일 문장, 예산 진행 막대, 동기화 중 표시
   의미색: 빨강 = 예산 초과·삭제·오류 (동기화 정상은 표시하지 않음)
   카드 안 글자: 크기 3가지까지. 같은 14px이면 회색 = 정보, 갈색 = 할 일
   박스 규칙: 주인공이거나 누르는 것만 박스. 나열은 박스 하나 + 구분선. 박스 안에 박스 금지
   날짜 표기: 11.15 (제목 줄만 11월 19일 목요일) / 금액 목록만 고정폭 숫자
   새 값을 만들지 말고 아래 변수만 쓸 것 */
:root{
  --accent:#F6D873; --accent-soft:#FDF6DC; --accent-ink:#6B4A12;
  --ink:#2C2C2C; --sub:#666666; --faint:#AFAAA0;
  --line:#E5E3DE; --fill:#EFECE6; --bg:#F9F8F6; --card:#FFFFFF;
  --bad:#D9534F;
  --fs-cap:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:30px;
  --fs-logo:24px; --font-logo:Fredoka,"Arial Rounded MT Bold",sans-serif; /* 로고 전용 예외 */
  --lh-ui:1.5; --lh-read:1.7;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-sheet:16px;
  --s1:8px; --s2:12px; --s3:16px; --s4:20px;
  --border:1px solid var(--line);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 화면 고정: iOS 고무줄 스크롤(꿀렁임) 방지 */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:var(--fs-md);line-height:var(--lh-ui);letter-spacing:-.01em;-webkit-user-select:none;user-select:none}
/* 아이폰 홈 화면 앱에서 입력칸이 눌리고 키보드가 뜨도록: 입력칸은 터치·선택을 기본값으로 */
input,textarea,select{-webkit-user-select:initial!important;user-select:initial!important;touch-action:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:var(--fs-md)} /* 16px 미만이면 iOS가 확대함 */
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
/* 제목 줄 */
header{padding:calc(var(--safe-t) + var(--s2)) var(--s2) var(--s2) var(--s3);display:flex;align-items:center;justify-content:space-between;gap:var(--s1);min-height:64px}
.htext{min-width:0}
header h1{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:var(--fs-cap);color:var(--sub)}
.hright{display:flex;align-items:center;gap:4px;flex:0 0 auto}
#hnav{display:flex;gap:4px;margin-right:var(--s1)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink)}
#setBtn{color:var(--sub)}
.logo{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-logo);font-weight:600;font-size:var(--fs-logo);line-height:1.1;letter-spacing:-.01em;color:var(--accent-ink)}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.iconbtn:active{background:var(--fill)}
.iconbtn svg{width:22px;height:22px}
#hnav .iconbtn{width:36px;height:36px;background:var(--card);border:var(--border)}
.sync{display:none;position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg)}
.sync.busy{display:block;background:var(--accent-ink)}
.sync.err{display:block;background:var(--bad)}
main{flex:1;min-height:0;padding:0 var(--s3) var(--s2);display:flex;flex-direction:column;gap:var(--s3);overflow:hidden}
nav{display:flex;border-top:var(--border);background:var(--card);padding:6px 0 var(--safe-b)}
nav button{flex:1;padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-cap);color:var(--sub)}
nav button svg{width:56px;height:30px;padding:4px 17px;border-radius:99px;box-sizing:border-box}
nav button.on{color:var(--ink);font-weight:600}
nav button.on svg{background:var(--accent)}
.card{background:var(--card);border-radius:var(--r-lg);border:var(--border);padding:var(--s4)}
.muted{color:var(--sub)} .small{font-size:var(--fs-cap)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:var(--r-md);background:var(--accent);color:var(--ink);font-weight:700;width:100%}
.btn:disabled{background:var(--fill);color:var(--faint)}
.btn.ghost{background:var(--fill);font-weight:600}
.btn.sm{height:38px;font-size:var(--fs-sm)}
.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-md);padding:2px}
.seg button{padding:6px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--sub);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 오늘: 메뉴 이름 → 정보 한 줄 → 목록 → 할 일 */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.hero .title{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.hero .meta{font-size:var(--fs-sm);color:var(--sub);margin-top:6px}
.items{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:var(--s4);padding-top:var(--s3);border-top:var(--border)}
.items li{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-md);line-height:var(--lh-read)}
.items li:before{content:"";flex:0 0 5px;height:5px;border-radius:50%;background:var(--faint);margin-top:12px}
.todo{margin-top:var(--s3);padding-top:var(--s3);border-top:var(--border);font-size:var(--fs-sm);line-height:var(--lh-read);color:var(--accent-ink);font-weight:500}
.nomeal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.nomeal .big{font-size:var(--fs-lg);font-weight:700}
.nomeal .todo{border-top:0;padding-top:0;margin-top:var(--s1)}
.preview{padding:0 4px;font-size:var(--fs-sm)}
.preview .lab{font-size:var(--fs-cap);color:var(--sub);font-weight:500;margin-bottom:2px}
.preview .menu{font-weight:700;font-size:var(--fs-md)}
.preview .prep{color:var(--accent-ink);margin-top:4px;line-height:var(--lh-read)}
/* 주간: 박스 하나 + 구분선. 요일-메뉴 이름(24px 줄), 날짜-설명(20px 줄)이 같은 높이 */
.days{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:var(--border);border-radius:var(--r-lg);overflow:hidden}
.day{flex:1;min-height:0;max-height:80px;display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-top:var(--border);cursor:pointer}
.day:first-child{border-top:0}
.day:active{background:var(--fill)}
.day.today{background:var(--accent-soft)}
.dw{flex:0 0 36px;display:flex;flex-direction:column}
.dw b{font-size:var(--fs-sm);font-weight:700;line-height:24px}
.dw span{font-size:var(--fs-cap);color:var(--sub);line-height:20px}
.dm{flex:1;min-width:0;min-height:44px}
.dt,.dd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:var(--fs-md);font-weight:700;line-height:24px}
.dd{font-size:var(--fs-sm);color:var(--sub);line-height:20px}
.day.off .dw b,.day.off .dw span,.day.off .dt,.day.empty .dt{color:var(--faint);font-weight:500}
.one{flex:0 0 auto;font-size:var(--fs-cap);font-weight:600;color:var(--sub);background:var(--fill);padding:2px 8px;border-radius:var(--r-sm)}
/* 장보기 */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:var(--r-lg);padding:var(--s4) var(--s3);text-align:center;background:var(--fill);cursor:pointer}
.drop.filled{background:var(--card);border:var(--border);gap:var(--s2)}
.drop svg{width:28px;height:28px;color:var(--sub);margin-bottom:2px}
.drop .dt2{font-size:var(--fs-md);font-weight:700}
.drop .dsub{font-size:var(--fs-sm);color:var(--sub)}
.drop .dsub b{color:var(--ink)}
.thumbs{display:flex;gap:var(--s1);overflow-x:auto;max-width:100%;padding-bottom:2px}
.thumbs img{height:96px;border-radius:var(--r-sm);border:var(--border);flex:0 0 auto}
.thumbs .addt{flex:0 0 64px;height:96px;border-radius:var(--r-sm);background:var(--fill);display:grid;place-items:center;font-size:var(--fs-lg);color:var(--sub)}
.field{display:flex;flex-direction:column;gap:6px}
.field.grow{flex:1;min-height:0}
.field label{font-size:var(--fs-cap);color:var(--sub);font-weight:600}
.inp{height:44px;border:var(--border);border-radius:var(--r-md);padding:0 var(--s2);background:var(--card);width:100%}
textarea.inp{height:auto;padding:var(--s2);resize:none;line-height:var(--lh-read)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* 비용: 카드 2개 (이번 주 / 한 달 기록) */
.goal .lab,.hist .lab{font-size:var(--fs-sm);color:var(--sub);font-weight:600}
.goal .num{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em;margin-top:2px}
.gbar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:var(--s3)}
.gbar div{height:100%;background:var(--accent-ink);border-radius:99px}
.gbar.over div{background:var(--bad)}
.gnote{display:flex;justify-content:space-between;font-size:var(--fs-sm);margin-top:var(--s1);color:var(--sub)}
.gnote .link{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:var(--fs-sm)}
.gnote .left{color:var(--ink);font-weight:600}
.gnote .over{color:var(--bad);font-weight:600}
.hist{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s3)}
.hhead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s1);padding-bottom:var(--s3);border-bottom:var(--border);font-size:var(--fs-sm)}
.hhead b{font-weight:700}
.bars{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s3);overflow-y:auto}
.bar{display:grid;grid-template-columns:44px 1fr 72px;align-items:center;gap:var(--s2);font-size:var(--fs-sm)}
.bar[data-w]{cursor:pointer}
.bar .tr{height:8px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--faint);border-radius:99px}
.bar .fl.over{background:var(--bad)}
.bar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar.nodata span:first-child,.bar.nodata .v{color:var(--faint);font-weight:400}
/* 시트 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:var(--s4) var(--s4) calc(var(--s4) + var(--safe-b));z-index:11;transform:translateY(105%);transition:transform .22s ease;max-height:88%;display:flex;flex-direction:column;gap:var(--s3)}
.sheet.on{transform:none}
.sheet h2{font-size:var(--fs-lg);font-weight:700}
.sheet .body{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;gap:var(--s1)}
.costitem{display:grid;grid-template-columns:1fr 96px;gap:var(--s1);align-items:center;font-size:var(--fs-sm)}
.costitem input{height:36px;border:var(--border);border-radius:var(--r-md);padding:0 var(--s1);text-align:right;width:100%;font-size:var(--fs-md);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px var(--s3);border-radius:var(--r-md);font-size:var(--fs-sm);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.86);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600}
.loading.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--accent-soft);border-top-color:var(--accent-ink);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.sheet,.toast{transition:none}}
.hide{display:none!important}
.hr{height:1px;background:var(--line);margin:2px 0}
</style>



</head>
<body>
<div id="app">
  <header>
    <div class="htext"><h1 id="htitle"></h1><div class="hsub hide" id="hsub"></div></div>
    <div class="hright">
      <div id="hnav"></div>
      <button class="iconbtn" id="setBtn" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="sync" id="syncDot" title="동기화 상태"></span>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11a7 7 0 0 0 14 0"/><path d="M12 4v3"/></svg>오늘</button>
    <button data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>주간</button>
    <button data-v="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>장보기</button>
    <button data-v="cost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>비용</button>
  </nav>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div><div id="loadingText">분석 중…</div></div>
<input type="file" id="importFile" accept="application/json" class="hide">

<script>
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate()-d.getDay()); return ymd(d); }; // 일요일 시작
const md = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; }; // 날짜 표기는 11.15로 통일
const mdDot = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; };
const wdOf = s => WD[parse(s).getDay()];
const won = n => (Math.round(n)||0).toLocaleString('ko-KR') + '원';
const man = n => { n=Math.round(n)||0; return n>=10000 ? (Math.round(n/1000)/10).toLocaleString('ko-KR')+'만원' : won(n); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => ymd(new Date());
/* 주차: 그 주 수요일이 속한 달 기준 */
function weekInfo(ws){
  const wed = parse(addDays(ws,3));
  const first = new Date(wed.getFullYear(), wed.getMonth(), 1);
  const n = Math.floor((wed.getDate()-1 + first.getDay())/7)+1;
  return {month: wed.getMonth()+1, ym:`${wed.getFullYear()}-${pad(wed.getMonth()+1)}`, n,
    label:`${wed.getMonth()+1}월 ${n}주차`, range:`${mdDot(ws)} – ${mdDot(addDays(ws,6))}`};
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
function loading(on, text){ $('#loading').classList.toggle('on',on); if(text) $('#loadingText').textContent=text; }

/* iOS 꿀렁임 방지: 스크롤 영역 밖의 터치 이동은 막기 */
document.addEventListener('touchmove', e => {
  const sc = e.target.closest('.scroll, textarea');
  if(!sc || sc.scrollHeight <= sc.clientHeight) e.preventDefault();
}, {passive:false});

const APP_VER='11.17-1';
/* ================= storage ================= */
const KEY = 'lunchPlanner.v2', SKEY = 'lunchPlanner.secrets';
let SEC; try{ SEC = JSON.parse(localStorage.getItem(SKEY)) || {}; }catch(e){ SEC={}; }
SEC.model = SEC.model || 'gemini-3.5-flash-lite';

  if(S.days[date]) return S.days[date];
  const c = (S.settings.defaultCounts||{})[parse(date).getDay()];

}

/* ================= 동기화 (GitHub Gist) ================= */
const GFILE = 'lunch-planner.json';
let pushTimer=null, syncing=false;
function dot(state){ $('#syncDot').className='sync '+(state||''); }
function syncOn(){ return !!(SEC.ghToken && SEC.gistId); }
async function gh(path, opt={}){
  const r = await fetch('https://api.github.com'+path, {...opt, headers:{
    'Authorization':'Bearer '+SEC.ghToken, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', ...(opt.headers||{})}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message || ('GitHub '+r.status));
  return j;
}
async function pull(silent){
  if(!syncOn()) { dot(''); return; }
  dot('busy');
  try{
    const g = await gh('/gists/'+SEC.gistId);
    const f = g.files?.[GFILE];
    if(f){
      let txt = f.content;
      if(f.truncated && f.raw_url){ txt = await (await fetch(f.raw_url)).text(); }
      const remote = JSON.parse(txt);
      if((remote.updatedAt||0) > (S.updatedAt||0)){
        S = remote; localStorage.setItem(KEY, JSON.stringify(S)); render();
        if(!silent) toast('최신 내용으로 업데이트했어요');
      } else if((remote.updatedAt||0) < (S.updatedAt||0)) { await push(); }
    } else { await push(); }
    SEC.lastSync = Date.now(); saveSec(); dot('ok');
  }catch(e){ dot('err'); if(!silent) toast('동기화 실패: '+e.message); }
}
async function push(){
  if(!syncOn() || syncing) return;
  syncing=true; dot('busy');
  try{
    await gh('/gists/'+SEC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(S)}}})});
    SEC.lastSync=Date.now(); saveSec(); dot('ok');
  }catch(e){ dot('err'); toast('동기화 실패: '+e.message); }
  finally{ syncing=false; }
}
function schedulePush(){ if(!syncOn()) return; clearTimeout(pushTimer); dot('busy'); pushTimer=setTimeout(push,1200); }
async function createGist(){
  const g = await gh('/gists',{method:'POST',body:JSON.stringify({description:'점심 식단 앱 데이터',public:false,files:{[GFILE]:{content:JSON.stringify(S)}}})});
  SEC.gistId=g.id; saveSec(); return g.id;
}

/* 사진 읽기: blob 주소가 막힌 환경(앱 미리보기 등)에서도 되도록 FileReader 사용 */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const r=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
          c.width=img.width*r; c.height=img.height*r; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          const data=c.toDataURL('image/jpeg',0.85); res({url:data,b64:data.split(',')[1],mime:'image/jpeg'});
        }catch(e){ rej(e); }
      };
      img.onerror=()=>rej(new Error('decode'));
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= Gemini ================= */
async function gemini(parts,{search=false,json=false}={}){
  const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.4,maxOutputTokens:32768}};
  if(search) body.tools=[{google_search:{}}];
  if(json&&!search) body.generationConfig.responseMimeType='application/json';
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(SEC.model||'gemini-3.5-flash-lite')}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':SEC.apiKey},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j?.error?.message||('HTTP '+r.status));
  const text=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join(''); // 생각 과정(thought) 텍스트는 제외
  if(!text) throw new Error('응답이 비어 있어요'+(j.candidates?.[0]?.finishReason?' ('+j.candidates[0].finishReason+')':''));
  window.__lastFinish=j.candidates?.[0]?.finishReason||'';
  return text;
}
function extractJSON(t){
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) t=m[1];
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<0) throw new Error('응답 형식 오류');
  t=t.slice(a,b+1);
  try{ return JSON.parse(t); }catch(_){}
  // 흔한 깨짐 고치기: 숫자 속 쉼표(5,500), 끝 쉼표, 굽은 따옴표, 출처 표시 [1]
  const fixed=t.replace(/[“”]/g,'"').replace(/[‘’]/g,"'")
    .replace(/("(?:price|qty|minutes)"\s*:\s*)"약?\s*([\d,]+)\s*(?:원|분|개)?"/g,(_,k,n)=>k+n.replace(/,/g,''))
    .replace(/("(?:price|qty|minutes)"\s*:\s*)(\d{1,3}(?:,\d{3})+)(?!\d)/g,(_,k,n)=>k+n.replace(/,/g,''))
    .replace(/\[\d+(?:,\s*\d+)*\]/g,'')
    .replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(fixed); }catch(_){}
  // 응답이 중간에 잘린 경우: 마지막으로 완성된 } 까지 자르고 열린 괄호를 닫아서 살리기
  for(let end=fixed.lastIndexOf('}'), tries=0; end>0 && tries<80; end=fixed.lastIndexOf('}',end-1), tries++){
    const part=fixed.slice(0,end+1); const st=[]; let inStr=false, esc=false;
    for(const ch of part){
      if(inStr){ if(esc) esc=false; else if(ch==='\\') esc=true; else if(ch==='"') inStr=false; continue; }
      if(ch==='"') inStr=true; else if(ch==='{'||ch==='[') st.push(ch); else if(ch==='}'||ch===']') st.pop();
    }
    if(inStr) continue;
    const close=st.reverse().map(c=>c==='{'?'}':']').join('');
    try{ return JSON.parse(part.replace(/,\s*$/,'')+close); }catch(_){}
  }
  throw new Error('응답 형식 오류');
}
/* 그래도 못 읽으면 AI에게 JSON만 다시 고쳐 달라고 한 번 더 요청 */
async function readJSON(raw){
  try{ return extractJSON(raw); }
  catch(_){
    if(window.__lastFinish==='MAX_TOKENS' && raw.length>20000) throw new Error('AI 응답이 너무 길어 잘렸어요 (MAX_TOKENS). 다시 시도해 주세요.');
    let again='';
    try{
      again=await gemini([{text:'아래 내용을 같은 의미의 올바른 JSON 하나로만 고쳐서 출력해. 설명 없이 JSON만.\n\n'+raw}],{json:true});
      return extractJSON(again);
    }catch(e){
      throw new Error(`AI 응답을 읽지 못했어요 (끝난 이유: ${window.__lastFinish||'알 수 없음'}, 길이 ${raw.length}자)\n\n받은 내용 앞부분:\n${raw.slice(0,400)}\n…\n끝부분:\n${raw.slice(-200)}`);
    }
  }
}
async function parseCart(images){
  const prompt=`첨부한 이미지는 이번에 장 본 식재료 사진이야. 아래 중 어떤 것이든 섞여 있을 수 있어:

- 오프라인 마트·시장 영수증 (축약된 상품명은 원래 이름으로 풀어 써)
- 산 물건을 찍은 사진 (포장에 적힌 상품명·중량을 읽어)
여러 장에 같은 상품이 겹쳐 나오면(예: 영수증과 물건 사진) 한 번만 써.
1) 모든 식재료 상품의 이름, 실제 결제 가격(할인 적용가. 취소선 가격 말고), 수량을 읽어. 봉투·배송비·쿠폰·포인트 같은 건 빼. 사진에 가격이 안 보이면 price는 0으로 둬(지어내지 마).
2) 각 상품을 Google 검색으로 찾아 중량/용량, 보관타입(냉장/냉동/상온), 소비기한 안내를 확인해. 캡처에 앱 이름이 보이면 그 쇼핑몰 상품 페이지를 우선 찾고, 영수증이면 그 마트 상품을 찾아. 사진·포장에 중량이 적혀 있으면 그걸 우선해. 못 찾으면 비슷한 상품 기준으로 추정하고 "약"을 붙여.
JSON만 출력:
{"items":[{"name":"[브랜드] 상품명","price":정수,"qty":정수,"weight":"예: 300g×2 / 약 280g","storage":"냉장|냉동|상온","shelf":"짧게","note":"해동 필요 등 짧게"}]}`;
  const imgParts=images.map(i=>({inline_data:{mime_type:i.mime,data:i.b64}}));
  let raw;
  try{ raw=await gemini([...imgParts,{text:prompt}],{search:true}); }
  catch(e){
    // 검색 기능 한도에 걸리면 검색 없이 다시 시도 (중량·보관은 추정)
    if(!/quota|exhaust|429|rate|ground|search|billing/i.test(e.message)) throw e;
    raw=await gemini([...imgParts,{text:prompt+'\n(지금은 검색을 쓸 수 없어. 상품명으로 추정하고 값 앞에 "약"을 붙여.)'}],{json:true});
  }
  const out=await readJSON(raw);
  const toNum=v=>+String(v??'').replace(/[^\d.]/g,'')||0; // "6,375원", "약 280"도 숫자로
  const items=(out.items||[]).map(i=>({name:i.name||'',price:toNum(i.price),qty:toNum(i.qty)||1,weight:i.weight||'',storage:i.storage||'',shelf:i.shelf||'',note:i.note||''})).filter(i=>i.name);
  if(!items.length) throw new Error('상품을 찾지 못했어요');
  return items;
}

async function replanWeek(ws){

/* AI가 보낸 날짜를 YYYY-MM-DD로 맞추기 (11.16, 11/16, 11월 16일, 월요일도 허용) */
function normDate(v, ws){
  const t=String(v||'').trim();
  let m=t.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=t.match(/(\d{1,2})\s*(?:[.\/-]|월)\s*(\d{1,2})/);
  if(m){
    const base=parse(ws); let y=base.getFullYear();
    if(+m[1]-(base.getMonth()+1) < -6) y++; else if(+m[1]-(base.getMonth()+1) > 6) y--;
    return `${y}-${pad(+m[1])}-${pad(+m[2])}`;
  }
  m=t.match(/^([일월화수목금토])(?:요일)?$/);            // "월" / "월요일"
  if(m) return addDays(ws, WD.indexOf(m[1]));           // 주는 일요일 시작
  return '';
}
/* 메뉴 구성: 목록·문장·다른 이름 모두 목록으로 */
function toItems(p){
  let v = p.items ?? p.menu ?? p.menus ?? p.dishes ?? p.components ?? p['구성'] ?? [];
  if(typeof v==='string') v=v.split(/\s*(?:,|·|\n|\/)\s*/);
  if(!Array.isArray(v)) v=[];
  return v.map(x=>typeof x==='string'?x:(x?.name? `${x.name}${x.amount?' '+x.amount:''}`:'')).map(x=>x.trim()).filter(Boolean);
}
function applyPlan(ws,out){
  let days = out.days ?? out.plan ?? out.meals ?? [];
  if(!Array.isArray(days)) days = Object.entries(days).map(([k,v])=>({date:k,...(typeof v==='object'?v:{title:String(v)})}));
  const by={};
  days.forEach(d=>{ const k=normDate(d.date ?? d.day ?? d.weekday ?? d['날짜'] ?? d['요일'], ws); if(k) by[k]=d; });
  // 날짜를 못 알아보면, 식사하는 날에 순서대로 배치
  if(!Object.keys(by).length && days.length){
    const mealDays=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(d=>getDay(d).count);
    days.forEach((d,i)=>{ if(mealDays[i]) by[mealDays[i]]=d; });
  }
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), cnt=getDay(d).count, p=by[d];
    const items = p ? toItems(p) : [];
    const title = p ? String(p.title ?? p.name ?? p.menu_name ?? (items[0]||'')) : '';
    S.days[d] = (cnt&&p) ? {count:cnt,title,items:items.length?items:(title?[title]:[]),portion:p.portion||'',minutes:parseInt(p.minutes)||''} : {count:cnt,title:'',items:[]};
  }
  for(let i=-2;i<7;i++) delete S.prep[addDays(ws,i)];
  (out.prep||out.todo||[]).forEach(p=>{ const k=normDate(p.date ?? p.day,ws); const txt=p.text||p.todo||p.task||''; if(k&&txt) (S.prep[k]=S.prep[k]||[]).push(txt); });
  save();
  // 그래도 메뉴가 하나도 안 들어갔으면 받은 내용을 보여줘서 원인 확인
  const filled=[...Array(7)].some((_,i)=>(S.days[addDays(ws,i)].items||[]).length);
  if(!filled) setTimeout(()=>showError('메뉴를 읽지 못했어요', 'AI가 보낸 내용:\n'+JSON.stringify(out).slice(0,1500)),300);
}

    st.defaultCounts={}; document.querySelectorAll('#kDef select').forEach(s=>st.defaultCounts[s.dataset.w]=+s.value);
    st.profile=$('#kProf').value; st.rules=$('#kRules').value;
    SEC.apiKey=$('#kKey').value.trim(); SEC.model=$('#kModel').value.trim()||'gemini-3.5-flash-lite';
    const tok=$('#kGh').value.trim(), gid=$('#kGist').value.trim();
    const syncChanged = tok!==(SEC.ghToken||'') || gid!==(SEC.gistId||'');
    SEC.ghToken=tok; SEC.gistId=gid; saveSec();
    closeSheet();
    if(tok && !gid){
      try{ loading(true,'공유 공간 만드는 중…'); await createGist(); save(); toast('공유 ID가 생겼어요. 설정에서 복사해 함께 쓸 폰에 넣어주세요'); }
      catch(e){ toast('만들기 실패: '+e.message); } finally{ loading(false); }
    } else if(syncChanged && tok && gid){ S.updatedAt=0; await pull(); }
    else save();
    render();
  };
  $('#kExp').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`점심식단-백업-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); toast('백업 파일을 저장했어요');
  };
  $('#kImp').onclick=()=>$('#importFile').click();
}
$('#importFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d.days||!d.shops) throw 0; S=d; save(); closeSheet(); render(); toast('불러오기 완료'); }
  catch(_){ toast('올바른 백업 파일이 아니에요'); }
  e.target.value='';
};

render();
pull(true);
</script>
</body>
</html>
